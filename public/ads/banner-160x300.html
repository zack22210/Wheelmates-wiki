<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advertisement 160x300</title>
    <style>html,body{width:160px;height:300px;margin:0;overflow:hidden;background:transparent}</style>
  </head>
  <body>
    <script data-cfasync="false">
      var atOptions = {
        key: (new URLSearchParams(location.search).get('key') || '').replace(/^\s+|\s+$/g, ''),
        format: 'iframe',
        height: 300,
        width: 160,
        params: {}
      };

      if (atOptions.key) {
        document.write('<script src="https://www.highperformanceformat.com/' + atOptions.key + '/invoke.js"><\/script>');
      }
    </script>
  </body>
</html>
