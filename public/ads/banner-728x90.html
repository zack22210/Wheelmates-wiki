<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advertisement 728x90</title>
    <style>html,body{width:728px;height:90px;margin:0;overflow:hidden;background:transparent}</style>
  </head>
  <body>
    <script data-cfasync="false">
      var atOptions = {
        key: (new URLSearchParams(location.search).get('key') || '').replace(/^\s+|\s+$/g, ''),
        format: 'iframe',
        height: 90,
        width: 728,
        params: {}
      };

      if (atOptions.key) {
        document.write('<script src="https://www.highperformanceformat.com/' + atOptions.key + '/invoke.js"><\/script>');
      }
    </script>
  </body>
</html>
